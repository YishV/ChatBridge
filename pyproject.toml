[project]
name = "wechat-ai-bridge"
version = "0.1.0"
description = "Modular WeChat group AI assistant scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["python-dotenv>=1.0,<2", "Pillow>=12,<13"]

[project.scripts]
wechat-ai-bridge = "wechat_ai_bridge.cli:main"

[project.optional-dependencies]
media = ["imageio-ffmpeg>=0.6,<0.7"]
native = [
    "zstandard>=0.25,<0.26",
    "sqlcipher3>=0.6.2,<0.7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_ai_bridge"]
